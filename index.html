<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olympus — Home Mockup v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
  }

  #wallpaper { position: fixed; inset: 0; z-index: 0; }
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);
  }

  /* ---------- Boot ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50; background: #000;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    transition: opacity .8s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #bootLogo {
    font-size: clamp(48px, 9vw, 110px); font-weight: 800;
    letter-spacing: .35em; text-indent: .35em;
    background: linear-gradient(180deg, #9fc5ff 0%, #2f6bff 55%, #0a1f66 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(47,107,255,.55));
    opacity: 0; transform: scale(.92);
    animation: logoIn 1.6s cubic-bezier(.2,.8,.2,1) .2s forwards;
  }
  #bootSub {
    font-size: clamp(11px, 1.6vw, 15px); letter-spacing: .5em; text-indent: .5em;
    color: #4d6db3; opacity: 0; animation: fadeUp 1.2s ease 1s forwards;
  }
  #bootBar {
    width: 180px; height: 3px; border-radius: 2px;
    background: rgba(80,120,220,.18); overflow: hidden;
    opacity: 0; animation: fadeUp 1s ease 1.3s forwards;
  }
  #bootBar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, #2f6bff, #9fc5ff); border-radius: 2px;
    animation: loadSlide 1.1s ease-in-out infinite;
  }
  @keyframes loadSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(480%); } }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Home ---------- */
  #home {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    padding: clamp(24px, 4vw, 56px) clamp(28px, 5vw, 72px);
    opacity: 0; visibility: hidden;
    transition: opacity .9s ease, visibility 0s .9s;
  }
  #home.show { opacity: 1; visibility: visible; transition: opacity .9s ease; }

  .rise { opacity: 0; transform: translateY(26px); }
  #home.show .rise { animation: riseIn .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0s); }
  @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }

  /* Top bar */
  #topbar { display: flex; align-items: center; justify-content: space-between; }
  #topLeft { display: flex; align-items: center; gap: 12px; position: relative; }
  /* Profile pic button — opens the profile switcher */
  #avatarBtn {
    width: 54px; height: 54px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, #2f6bff, #0a1f66);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 19px; color: #cfe0ff;
    box-shadow: 0 0 18px rgba(47,107,255,.5);
    border: 1px solid rgba(90, 130, 255, .35);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  #avatarBtn:hover { transform: scale(1.06); }
  /* Player focus glow follows to the avatar while switching profiles */
  body.profile-open #avatarBtn {
    box-shadow: 0 0 0 3px rgba(47,107,255,.35), 0 0 28px rgba(47,107,255,.65);
  }
  body.profile-open .tile.focused {
    transform: none;
    border: 1px solid rgba(100, 140, 255, .22);
    box-shadow: none;
  }
  /* Who's playing? switcher */
  #profileMenu {
    position: absolute; top: calc(100% + 12px); left: 0; z-index: 32;
    min-width: 250px;
    background: rgba(8, 14, 30, .96);
    border: 1px solid rgba(90, 130, 255, .25);
    border-radius: 16px; backdrop-filter: blur(18px);
    padding: 14px; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  #profileMenu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #profileMenu h3 { font-size: 11px; letter-spacing: .3em; color: #5f7fc4; padding: 4px 10px 8px; }
  .profileItem {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent;
    font-size: 15px; color: #dbe6ff;
    transition: background .2s, border-color .2s;
  }
  .profileItem .pAv {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #cfe0ff;
    background: linear-gradient(135deg, #2f6bff, #0a1f66);
  }
  .profileItem.add .pAv { background: rgba(47,107,255,.15); border: 1px dashed rgba(127,176,255,.5); font-size: 20px; }
  .profileItem:hover, .profileItem.focused {
    background: rgba(47, 107, 255, .16);
    border-color: #7fb0ff;
    box-shadow: 0 0 0 3px rgba(47,107,255,.35), 0 8px 28px rgba(47,107,255,.35);
  }
  .profileItem .check { margin-left: auto; color: #7fb0ff; font-size: 16px; }
  #topIcons { display: flex; gap: 12px; align-items: center; }
  #clock { font-size: 15px; color: #8fa8dd; letter-spacing: .12em; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .iconBtn {
    width: 46px; height: 46px; border-radius: 14px;
    background: rgba(10, 18, 40, .55);
    border: 1px solid rgba(90, 130, 255, .25);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #9fc5ff;
    transition: transform .15s ease;
  }
  .iconBtn:active { transform: scale(.93); }

  /* Games row */
  #gamesZone { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 18px; min-height: 0; }
  #gamesHead { margin-bottom: auto; }

  /* Full-screen hero art behind the whole screen (PS-style) */
  #heroBG {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
    background:
      radial-gradient(120% 90% at 85% 20%, hsla(var(--h1, 222), 85%, 55%, .5), transparent 60%),
      radial-gradient(100% 100% at 70% 90%, hsla(var(--h2, 280), 90%, 45%, .38), transparent 55%),
      linear-gradient(135deg, hsl(var(--h1, 222), 55%, 14%), hsl(var(--h2, 280), 65%, 7%));
  }
  #heroBG.on { opacity: 1; }
  #heroBG::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.25) 42%, rgba(0,0,0,.45) 100%);
  }

  /* Game title + description floating over the art, just above the row */
  #gameMeta { padding: 0 10px 16px; opacity: 0; transition: opacity .4s ease; }
  #gameMeta.show { opacity: 1; }
  #gameTitle { font-size: clamp(30px, 4vw, 54px); font-weight: 800; letter-spacing: .03em; text-shadow: 0 3px 24px rgba(0,0,0,.8); }
  #gameDesc { margin-top: 10px; font-size: 14px; color: #c3d4f8; letter-spacing: .05em; max-width: 560px; line-height: 1.55; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #gamesHead h1 { font-size: clamp(24px, 3vw, 36px); font-weight: 700; letter-spacing: .06em; }
  #gamesHead p { margin-top: 6px; font-size: 13px; color: #5f7fc4; letter-spacing: .22em; }

  #rowWrap { position: relative; }
  #tileRow {
    display: flex; gap: 20px;
    overflow-x: auto; scrollbar-width: none;
    padding: 70px 56px; margin: -70px -56px;
    scroll-behavior: smooth;
  }
  #tileRow::-webkit-scrollbar { display: none; }

  .tile {
    flex: 0 0 auto;
    width: clamp(150px, 15vw, 210px); aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: transparent;
    border: 1px solid rgba(100, 140, 255, .22);
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    cursor: pointer;
  }
  /* Player focus glow — follows the player wherever they navigate */
  .tile.focused {
    transform: scale(1.07);
    border: 2px solid #7fb0ff;
    box-shadow: 0 0 0 3px rgba(47,107,255,.35), 0 14px 44px rgba(47,107,255,.4);
  }
  body.menu-open .tile.focused {
    transform: none;
    border: 1px solid rgba(100, 140, 255, .22);
    box-shadow: none;
  }
  .tile.library {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(16, 28, 62, .6);
    border: 1px solid rgba(100, 140, 255, .3);
  }
  .tile.library .gridIcon {
    display: grid; grid-template-columns: repeat(2, 18px); grid-template-rows: repeat(2, 18px); gap: 6px;
  }
  .tile.library .gridIcon i { background: rgba(150, 185, 255, .55); border-radius: 4px; }
  .tile.library span { font-size: 12px; letter-spacing: .28em; text-indent: .28em; color: #8fb0ff; }

  #padStatus {
    font-size: 11px; letter-spacing: .18em; color: #8fd694;
    border: 1px solid rgba(120, 220, 150, .35);
    background: rgba(16, 50, 30, .5);
    padding: 8px 14px; border-radius: 999px;
    white-space: nowrap;
  }

  /* Side menu */
  #menuOverlay {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .5);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #menuOverlay.show { opacity: 1; pointer-events: auto; }
  #sideMenu {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 31;
    width: clamp(260px, 26vw, 340px);
    background: rgba(8, 14, 30, .94);
    border-right: 1px solid rgba(90, 130, 255, .25);
    backdrop-filter: blur(18px);
    transform: translateX(-105%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
    padding: 32px 22px; gap: 8px;
  }
  #sideMenu.open { transform: translateX(0); }
  #sideMenu h2 { font-size: 13px; letter-spacing: .34em; color: #5f7fc4; margin-bottom: 16px; padding-left: 14px; }
  .menuBtn {
    display: flex; align-items: center; gap: 16px;
    padding: 15px 16px; border-radius: 14px;
    font-size: 16px; letter-spacing: .05em; color: #dbe6ff;
    cursor: pointer; border: 1px solid transparent;
    transition: background .2s, border-color .2s;
    opacity: 0; transform: translateX(-18px);
  }
  #sideMenu.open .menuBtn { animation: menuBtnIn .45s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
  @keyframes menuBtnIn { to { opacity: 1; transform: translateX(0); } }
  .menuBtn:hover, .menuBtn.focused {
    background: rgba(47, 107, 255, .16);
    border-color: #7fb0ff;
    box-shadow: 0 0 0 3px rgba(47,107,255,.35), 0 8px 28px rgba(47,107,255,.35);
  }
  .menuBtn .mi { font-size: 22px; width: 30px; text-align: center; }

  /* Toast */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(14, 24, 52, .92);
    border: 1px solid rgba(120, 160, 255, .35);
    padding: 12px 26px; border-radius: 999px;
    font-size: 13px; letter-spacing: .14em; color: #b9cdf7;
    opacity: 0; pointer-events: none; z-index: 40;
    transition: opacity .3s ease, transform .3s ease;
    backdrop-filter: blur(10px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #skipTip { position: fixed; bottom: 14px; right: 20px; z-index: 60; font-size: 11px; letter-spacing: .2em; color: #3d5488; }

  /* Menu tab — left-edge tab showing the controller's top face button */
  #menuTab {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 29;
    background: rgba(8, 14, 30, .9);
    border: 1px solid rgba(90, 130, 255, .25); border-left: none;
    border-radius: 0 14px 14px 0;
    padding: 14px 10px 14px 8px;
    cursor: pointer; backdrop-filter: blur(12px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    opacity: 0; animation: tabIn .8s ease 1s forwards;
    transition: transform .35s ease, opacity .35s ease;
  }
  @keyframes tabIn { to { opacity: 1; } }
  #menuTabBtn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(47,107,255,.18);
    border: 1px solid rgba(127,176,255,.5);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #9fc5ff;
  }
  #menuTab small { font-size: 9px; letter-spacing: .24em; color: #5f7fc4; writing-mode: vertical-rl; }
  #menuTab:hover #menuTabBtn { box-shadow: 0 0 14px rgba(47,107,255,.6); }
  body.menu-open #menuTab { transform: translateY(-50%) translateX(-110%); opacity: 0; pointer-events: none; }

  /* ---------- Accounts ---------- */
  #accountScreen {
    position: fixed; inset: 0; z-index: 45;
    background: rgba(2, 5, 14, .82);
    backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center;
  }
  #accountScreen.open { display: flex; }
  .acctCard {
    width: min(430px, 92vw);
    background: rgba(8, 14, 30, .96);
    border: 1px solid rgba(90, 130, 255, .3);
    border-radius: 22px;
    padding: 34px 34px 28px;
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 60px rgba(47,107,255,.12);
    display: flex; flex-direction: column; gap: 14px;
    animation: acctIn .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes acctIn { from { opacity: 0; transform: translateY(22px) scale(.98); } }
  #acctLogo {
    font-size: 22px; font-weight: 800; letter-spacing: .35em; text-indent: .35em; text-align: center;
    background: linear-gradient(180deg, #9fc5ff, #2f6bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .acctCard h2 { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  #acctNotice { text-align: center; font-size: 13px; color: #8fb0ff; line-height: 1.5; }
  #acctNotice:empty { display: none; }
  .acctTabs { display: flex; background: rgba(20,32,66,.6); border-radius: 12px; padding: 4px; gap: 4px; }
  .acctTab { flex: 1; text-align: center; padding: 10px; border-radius: 9px; font-size: 14px; color: #8fa8dd; cursor: pointer; letter-spacing: .04em; }
  .acctTab.active { background: rgba(47,107,255,.25); color: #fff; box-shadow: inset 0 0 0 1px rgba(127,176,255,.4); }
  .acctCard input[type=text], .acctCard input[type=email], .acctCard input[type=password] {
    width: 100%; padding: 13px 15px; border-radius: 12px;
    background: rgba(16,26,54,.7); border: 1px solid rgba(90,130,255,.28);
    color: #fff; font-size: 15px; font-family: inherit; outline: none;
  }
  .acctCard input:focus { border-color: #7fb0ff; box-shadow: 0 0 0 3px rgba(47,107,255,.25); }
  .acctCard input::placeholder { color: #4d6db3; }
  .nameRow { display: flex; gap: 10px; }
  .tagRow { display: flex; gap: 10px; }
  .tagRow input { flex: 1; }
  #acctDice {
    width: 48px; flex: 0 0 auto; border-radius: 12px; font-size: 20px; cursor: pointer;
    background: rgba(47,107,255,.16); border: 1px solid rgba(127,176,255,.45); color: #cfe0ff;
  }
  #acctDice:hover { background: rgba(47,107,255,.3); }
  #acctDice:active { transform: scale(.93); }
  #acctAvatarWrap { display: flex; align-items: center; gap: 16px; }
  #acctAvatarPreview {
    width: 64px; height: 64px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, #2f6bff, #0a1f66);
    border: 1px solid rgba(127,176,255,.45);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #cfe0ff; overflow: hidden;
  }
  #acctAvatarPreview img { width: 100%; height: 100%; object-fit: cover; }
  #acctUploadBtn {
    padding: 10px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .06em; cursor: pointer;
    background: rgba(47,107,255,.14); border: 1px solid rgba(127,176,255,.4); color: #b9cdf7; font-family: inherit;
  }
  #acctUploadBtn:hover { background: rgba(47,107,255,.28); }
  .acctBtn {
    padding: 14px; border-radius: 13px; font-size: 16px; font-weight: 700; letter-spacing: .05em; cursor: pointer;
    background: linear-gradient(135deg, #2f6bff, #1a3fa0); border: 1px solid rgba(127,176,255,.5); color: #fff; font-family: inherit;
    box-shadow: 0 8px 28px rgba(47,107,255,.35);
  }
  .acctBtn:hover { filter: brightness(1.12); }
  .acctBtn:active { transform: scale(.98); }
  .acctBtn:disabled { opacity: .55; cursor: default; }
  .acctError { font-size: 13px; color: #ff8f9f; text-align: center; }
  .acctError:empty { display: none; }
  #acctSkip { text-align: center; font-size: 13px; color: #5f7fc4; cursor: pointer; letter-spacing: .06em; padding: 4px; }
  #acctSkip:hover { color: #9fc5ff; }
  #gamerTag { font-size: 14px; color: #b9cdf7; letter-spacing: .08em; font-weight: 600; }
  #avatarBtn img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  @media (max-width: 760px) {
    #hintbar { flex-wrap: wrap; gap: 16px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<canvas id="wallpaper"></canvas>
<div id="heroBG"></div>
<div id="vignette"></div>

<div id="boot">
  <div id="bootLogo">OLYMPUS</div>
  <div id="bootSub">PRESS START</div>
  <div id="bootBar"><i></i></div>
</div>
<div id="home">
  <div id="topbar">
    <div id="topLeft">
      <div id="avatarBtn" class="rise" style="--d:.15s" title="Switch profile">?</div>
      <div id="gamerTag" class="rise" style="--d:.18s">No account</div>
      <div id="profileMenu">
        <h3>WHO'S PLAYING?</h3>
      </div>
      <div class="iconBtn rise" id="padBtn" style="--d:.22s" title="Controllers"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v3M5.5 12h3"/><circle cx="15.5" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.5" r="1.1" fill="currentColor" stroke="none"/></svg></div>
    </div>
    <div id="topIcons" class="rise" style="--d:.3s">
      <div id="clock">--:--</div>
      <div class="iconBtn">◉</div>
      <div class="iconBtn">⚙</div>
    </div>
  </div>

  <div id="gamesZone">
    <div id="gamesHead" class="rise" style="--d:.5s">
      <h1>Recently Played</h1>
      <p>PICK UP WHERE YOU LEFT OFF</p>
    </div>
    <div id="gameMeta">
      <div id="gameTitle"></div>
      <div id="gameDesc"></div>
    </div>
    <div id="rowWrap" class="rise" style="--d:.65s">
      <div id="tileRow" tabindex="0"></div>
    </div>
  </div>

</div>

<div id="accountScreen">
  <div class="acctCard">
    <div id="acctLogo">OLYMPUS</div>
    <h2>Your Olympus account</h2>
    <p id="acctNotice"></p>
    <div class="acctTabs">
      <div class="acctTab active" id="tabCreate">Create account</div>
      <div class="acctTab" id="tabSignin">Sign in</div>
    </div>
    <div id="paneCreate" style="display:flex;flex-direction:column;gap:14px">
      <div id="acctAvatarWrap">
        <div id="acctAvatarPreview">?</div>
        <button id="acctUploadBtn" type="button">Upload pic</button>
        <input type="file" id="acctFile" accept="image/*" hidden>
      </div>
      <div class="nameRow">
        <input type="text" id="acctFirst" placeholder="First name" maxlength="30">
        <input type="text" id="acctLast" placeholder="Last name" maxlength="30">
      </div>
      <input type="email" id="acctEmail" placeholder="Email" maxlength="80">
      <div class="nameRow">
        <input type="password" id="acctPw" placeholder="Password" maxlength="64">
        <input type="password" id="acctPw2" placeholder="Confirm password" maxlength="64">
      </div>
      <div class="tagRow">
        <input type="text" id="acctTag" placeholder="Gamertag" maxlength="16">
        <button id="acctDice" type="button" title="Random gamertag">🎲</button>
      </div>
      <div class="acctError" id="createError"></div>
      <button class="acctBtn" id="acctCreateBtn" type="button">Create account</button>
    </div>
    <div id="paneSignin" style="display:none;flex-direction:column;gap:14px">
      <input type="email" id="signinEmail" placeholder="Email" maxlength="80">
      <input type="password" id="signinPw" placeholder="Password" maxlength="64">
      <div class="acctError" id="signinError"></div>
      <button class="acctBtn" id="acctSigninBtn" type="button">Sign in</button>
    </div>
    <div id="acctSkip">Skip for now</div>
  </div>
</div>

<div id="menuTab" title="Open menu"><span id="menuTabBtn">Y</span><small>MENU</small></div>
<div id="menuOverlay"></div>
<nav id="sideMenu">
  <h2>OLYMPUS</h2>
  <div class="menuBtn" style="--d:.05s"><span class="mi">🎮</span>Game Library</div>
  <div class="menuBtn" id="menuShop" style="--d:.1s"><span class="mi">🛒</span>Shop</div>
  <div class="menuBtn" style="--d:.15s"><span class="mi">◉</span>Ondra AI</div>
  <div class="menuBtn" id="menuFriends" style="--d:.2s"><span class="mi">👥</span>Friends</div>
  <div class="menuBtn" id="menuMessages" style="--d:.25s"><span class="mi">💬</span>Messages</div>
  <div class="menuBtn" id="menuProfile" style="--d:.3s"><span class="mi">👤</span>Profile</div>
  <div class="menuBtn" style="--d:.35s"><span class="mi">⚙</span>Settings</div>
</nav>

<div id="skipTip">MOCKUP — CLICK TO SKIP BOOT</div>

<script>
  /* Wavy vertical stripe wallpaper */
  const cv = document.getElementById('wallpaper');
  const ctx = cv.getContext('2d');
  let W, H, lines = [];
  const LINE_COUNT = 46;
  function build() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    lines = [];
    const gap = W / (LINE_COUNT - 1);
    for (let i = 0; i < LINE_COUNT; i++) {
      lines.push({
        x: i * gap,
        amp: 26 + Math.random() * 30,
        freq: 0.0016 + Math.random() * 0.0018,
        speed: 0.00035 + Math.random() * 0.0005,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.10 + Math.random() * 0.16
      });
    }
  }
  function draw(t) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 2;
    for (const L of lines) {
      ctx.beginPath();
      for (let y = -10; y <= H + 10; y += 8) {
        const x = L.x + Math.sin(y * L.freq + t * L.speed + L.phase) * L.amp;
        y === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `hsla(224, 95%, 52%, ${L.alpha})`;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  build(); addEventListener('resize', build); requestAnimationFrame(draw);

  /* Recently-played games (placeholder data).
     First-party games get a custom icon different from the hero art;
     third-party games reuse the same art for both (hero falls back to icon). */
  /* No games installed yet — all slots are blank */
  const games = [
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
    { name: '', desc: '', icon: null },
  ];
  function artBG(h1, h2) {
    return 'radial-gradient(120% 90% at 85% 20%, hsla(' + h1 + ', 85%, 55%, .55), transparent 60%), ' +
      'radial-gradient(100% 100% at 70% 90%, hsla(' + h2 + ', 90%, 45%, .4), transparent 55%), ' +
      'linear-gradient(135deg, hsl(' + h1 + ', 60%, 16%), hsl(' + h2 + ', 70%, 8%))';
  }

  /* Tiles: 10 recently-played, each showing its icon art */
  const row = document.getElementById('tileRow');
  const tiles = [];
  games.forEach((g, i) => {
    const d = document.createElement('div');
    d.className = 'tile';
    d.dataset.i = i;
    if (g.icon) {
      d.title = g.name;
      d.style.background = artBG(g.icon[0], g.icon[1]);
    }
    if (g.iconImg && g.iconImg.indexOf('data:image') === 0) {
      d.style.background = 'url(' + g.iconImg + ') center / cover no-repeat, ' + artBG(g.icon[0], g.icon[1]);
    }
    row.appendChild(d); tiles.push(d);
  });

  let focus = 0;
  function setFocus(i, scroll = true) {
    focus = Math.max(0, Math.min(tiles.length - 1, i));
    tiles.forEach((t, k) => t.classList.toggle('focused', k === focus));
    paintHero(focus);
    if (scroll) tiles[focus].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  const heroBG = document.getElementById('heroBG');
  const gameMeta = document.getElementById('gameMeta');
  const gameTitle = document.getElementById('gameTitle');
  const gameDesc = document.getElementById('gameDesc');
  function paintHero(i) {
    const g = games[i];
    if (g.hero) {
      heroBG.style.setProperty('--h1', g.hero[0]);
      heroBG.style.setProperty('--h2', g.hero[1]);
      heroBG.classList.add('on');
      gameTitle.textContent = g.name;
      gameDesc.textContent = g.desc;
      gameMeta.classList.add('show');
    } else {
      heroBG.classList.remove('on');
      gameMeta.classList.remove('show');
    }
  }

  /* ---------- Olympus accounts (cloud) ----------
     Accounts live in Supabase: Auth handles email + password securely
     server-side, profiles hold the gamertag, and game_saves holds cloud
     saves. Games read window.Olympus.account.gamertag when they have no
     separate account system, and use cloudSave/cloudLoad for saves. */
  window.Olympus = window.Olympus || {};
  const SUPABASE_URL = 'https://zzsvqnnrfngfxtucszgr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6c3Zxbm5yZm5nZnh0dWNzemdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDAzNTksImV4cCI6MjEwNjE3NjM1OX0.R-MCzou_q_ObnwXKCQRsRYy0Bwnand-1ktiatLfQ0aU';
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let account = null; // { id, email, firstName, lastName, gamertag, pic }
  function currentAccount() { return account; }
  async function refreshAccount() {
    try {
      const { data: { session } } = await supa.auth.getSession();
      if (!session) { account = null; }
      else {
        const { data: prof } = await supa.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
        account = prof
          ? { id: session.user.id, email: session.user.email, firstName: prof.first_name, lastName: prof.last_name, gamertag: prof.gamertag, pic: prof.pic || null }
          : null;
      }
    } catch (e) { account = null; }
    paintAccountBadge();
    buildProfileItems();
  }
  /* Games read this for the player's identity when they have no login of their own */
  Object.defineProperty(window.Olympus, 'account', {
    get() {
      const a = currentAccount();
      return a ? { gamertag: a.gamertag, firstName: a.firstName, lastName: a.lastName, email: a.email, pic: a.pic } : null;
    }
  });
  /* Cloud saves — one row per player per game per slot */
  window.Olympus.cloudSave = async function (game, slot, data) {
    const a = currentAccount();
    if (!a) throw new Error('Not signed in');
    const { error } = await supa.from('game_saves').upsert(
      { user_id: a.id, game: game, slot: slot || 'auto', data: data, updated_at: new Date().toISOString() },
      { onConflict: 'user_id,game,slot' }
    );
    if (error) throw error;
  };
  window.Olympus.cloudLoad = async function (game, slot) {
    const a = currentAccount();
    if (!a) return null;
    const { data, error } = await supa.from('game_saves').select('data').eq('user_id', a.id).eq('game', game).eq('slot', slot || 'auto').maybeSingle();
    if (error || !data) return null;
    return data.data;
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function initials(tag) {
    const t = (tag || '').replace(/[^A-Za-z0-9]/g, '');
    return (t.slice(0, 2) || '?').toUpperCase();
  }

  /* Random gamertag generator */
  const TAG_A = ['Shadow','Iron','Nova','Blaze','Frost','Thunder','Ghost','Solar','Crimson','Echo','Vortex','Onyx','Pixel','Storm','Lunar','Apex','Drift','Ember','Flux','Zero'];
  const TAG_B = ['Fox','Wolf','Hawk','Bear','Viper','Falcon','Raven','Tiger','Cobra','Dragon','Puma','Shark','Wraith','Bolt','Rider','Hunter','Saber','Comet','Reaper','Titan'];
  function randomTag() {
    return TAG_A[Math.floor(Math.random() * TAG_A.length)] +
           TAG_B[Math.floor(Math.random() * TAG_B.length)] +
           (100 + Math.floor(Math.random() * 900));
  }

  /* Account screen */
  const accountScreen = document.getElementById('accountScreen');
  const acctFirst = document.getElementById('acctFirst');
  const acctLast = document.getElementById('acctLast');
  const acctEmail = document.getElementById('acctEmail');
  const acctTag = document.getElementById('acctTag');
  const acctPw = document.getElementById('acctPw');
  const acctPw2 = document.getElementById('acctPw2');
  const acctFile = document.getElementById('acctFile');
  const tabCreate = document.getElementById('tabCreate');
  const tabSignin = document.getElementById('tabSignin');
  const paneCreate = document.getElementById('paneCreate');
  const paneSignin = document.getElementById('paneSignin');
  let accountOpen = false, draftPic = null;

  function setTab(which) {
    const c = which === 'create';
    tabCreate.classList.toggle('active', c);
    tabSignin.classList.toggle('active', !c);
    paneCreate.style.display = c ? 'flex' : 'none';
    paneSignin.style.display = c ? 'none' : 'flex';
  }
  tabCreate.addEventListener('click', () => setTab('create'));
  tabSignin.addEventListener('click', () => setTab('signin'));

  function paintAcctAvatar() {
    const prev = document.getElementById('acctAvatarPreview');
    if (draftPic) prev.innerHTML = '<img src="' + draftPic + '" alt="">';
    else prev.textContent = initials(acctTag.value.trim());
  }
  acctTag.addEventListener('input', paintAcctAvatar);
  document.getElementById('acctDice').addEventListener('click', () => {
    acctTag.value = randomTag();
    paintAcctAvatar();
  });
  document.getElementById('acctUploadBtn').addEventListener('click', () => acctFile.click());
  acctFile.addEventListener('change', () => {
    const f = acctFile.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const s = 256, c = document.createElement('canvas');
      c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      draftPic = c.toDataURL('image/png');
      URL.revokeObjectURL(img.src);
      paintAcctAvatar();
    };
    img.src = URL.createObjectURL(f);
  });

  function openAccount(notice) {
    accountOpen = true;
    document.getElementById('acctNotice').textContent = notice || '';
    document.getElementById('createError').textContent = '';
    document.getElementById('signinError').textContent = '';
    setTab('create');
    if (profileMenuOpen) setProfileMenu(false);
    if (menuOpen) setMenu(false);
    accountScreen.classList.add('open');
  }
  function closeAccount() {
    accountOpen = false;
    accountScreen.classList.remove('open');
    draftPic = null;
    acctFile.value = '';
    paintAcctAvatar();
  }
  document.getElementById('acctSkip').addEventListener('click', closeAccount);

  /* Gate: Shop + communication features need an account */
  function requireAccount(feature) {
    if (currentAccount()) return true;
    openAccount('You need an Olympus account to use ' + feature + '.');
    return false;
  }

  document.getElementById('acctCreateBtn').addEventListener('click', async () => {
    const first = acctFirst.value.trim(), last = acctLast.value.trim();
    const email = acctEmail.value.trim().toLowerCase();
    const tag = acctTag.value.trim();
    const pw = acctPw.value, pw2 = acctPw2.value;
    const err = document.getElementById('createError');
    const btn = document.getElementById('acctCreateBtn');
    if (!first || !last) err.textContent = 'Enter your first and last name.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err.textContent = 'Enter a valid email address.';
    else if (tag.length < 3 || tag.length > 16) err.textContent = 'Gamertag must be 3–16 characters.';
    else if (pw.length < 4) err.textContent = 'Password must be at least 4 characters.';
    else if (pw !== pw2) err.textContent = 'Passwords don\'t match.';
    else {
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const { data, error } = await supa.auth.signUp({ email: email, password: pw });
        if (error) throw error;
        const user = data.user;
        if (!user) throw new Error('Check your email to confirm, then sign in.');
        const { error: pErr } = await supa.from('profiles').insert({
          id: user.id, first_name: first, last_name: last, gamertag: tag, pic: draftPic
        });
        if (pErr) {
          if (pErr.code === '23505') err.textContent = 'That gamertag is taken — try another.';
          else err.textContent = pErr.message;
        } else {
          await refreshAccount();
          closeAccount();
        }
      } catch (e) {
        err.textContent = /already registered/i.test(e.message || '')
          ? 'That email already has an account — sign in instead.'
          : (e.message || 'Couldn\'t create the account.');
      }
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
  document.getElementById('acctSigninBtn').addEventListener('click', async () => {
    const email = document.getElementById('signinEmail').value.trim().toLowerCase();
    const pw = document.getElementById('signinPw').value;
    const err = document.getElementById('signinError');
    const btn = document.getElementById('acctSigninBtn');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const { error } = await supa.auth.signInWithPassword({ email: email, password: pw });
      if (error) throw error;
      await refreshAccount();
      if (!currentAccount()) throw new Error('Signed in, but no Olympus profile was found for this login.');
      closeAccount();
    } catch (e) {
      err.textContent = /invalid login credentials/i.test(e.message || '')
        ? 'Wrong email or password.'
        : (e.message || 'Couldn\'t sign in.');
    }
    btn.disabled = false; btn.textContent = 'Sign in';
  });

  /* Top-left badge: pic (or gamertag initials) + gamertag */
  const avatarBtn = document.getElementById('avatarBtn');
  const gamerTagEl = document.getElementById('gamerTag');
  function paintAccountBadge() {
    const a = currentAccount();
    if (a) {
      avatarBtn.innerHTML = a.pic ? '<img src="' + a.pic + '" alt="">' : escapeHtml(initials(a.gamertag));
      gamerTagEl.textContent = a.gamertag;
    } else {
      avatarBtn.textContent = '?';
      gamerTagEl.textContent = 'No account';
    }
  }

  /* Who's playing? — current account, switch, sign out */
  const profileMenu = document.getElementById('profileMenu');
  const profileItems = [];
  let profileMenuOpen = false, profileFocus = 0;
  function buildProfileItems() {
    profileMenu.querySelectorAll('.profileItem').forEach(el => el.remove());
    profileItems.length = 0;
    const a = currentAccount();
    if (a) {
      const d = document.createElement('div');
      d.className = 'profileItem';
      const av = a.pic
        ? '<img src="' + a.pic + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'
        : escapeHtml(initials(a.gamertag));
      d.innerHTML = '<div class="pAv">' + av + '</div><span>' + escapeHtml(a.gamertag) + '</span><span class="check">✓</span>';
      d.addEventListener('click', e => { e.stopPropagation(); setProfileMenu(false); });
      d.addEventListener('mouseenter', () => { profileFocus = 0; paintProfiles(); });
      profileMenu.appendChild(d); profileItems.push(d);
    }
    const add = document.createElement('div');
    add.className = 'profileItem add';
    add.innerHTML = '<div class="pAv">+</div><span>' + (a ? 'Switch account' : 'Add account') + '</span>';
    add.addEventListener('click', e => { e.stopPropagation(); setProfileMenu(false); openAccount(''); });
    add.addEventListener('mouseenter', () => { profileFocus = profileItems.length; paintProfiles(); });
    profileMenu.appendChild(add); profileItems.push(add);
    if (a) {
      const so = document.createElement('div');
      so.className = 'profileItem';
      so.innerHTML = '<div class="pAv">↩</div><span>Sign out</span>';
      so.addEventListener('click', async e => {
        e.stopPropagation();
        try { await supa.auth.signOut(); } catch (e2) {}
        account = null;
        paintAccountBadge(); buildProfileItems(); setProfileMenu(false);
      });
      so.addEventListener('mouseenter', () => { profileFocus = profileItems.length; paintProfiles(); });
      profileMenu.appendChild(so); profileItems.push(so);
    }
  }
  function setProfileMenu(open) {
    profileMenuOpen = open;
    document.body.classList.toggle('profile-open', open);
    profileMenu.classList.toggle('open', open);
    if (open) {
      if (menuOpen) setMenu(false);
      profileFocus = 0;
      paintProfiles();
    }
  }
  function paintProfiles() {
    const a = currentAccount();
    profileItems.forEach((el, k) => {
      el.classList.toggle('focused', k === profileFocus);
      const chk = el.querySelector('.check');
      if (chk) chk.style.visibility = (a && k === 0) ? 'visible' : 'hidden';
    });
  }
  refreshAccount();
  avatarBtn.addEventListener('click', e => { e.stopPropagation(); setProfileMenu(!profileMenuOpen); });
  document.addEventListener('click', e => {
    if (profileMenuOpen && !profileMenu.contains(e.target) && e.target !== avatarBtn) setProfileMenu(false);
  });

  /* Menu tab — shows the top face button for the connected controller */
  const menuTab = document.getElementById('menuTab');
  const menuTabBtn = document.getElementById('menuTabBtn');
  /* Controller preset — the active preset decides which button opens the menu.
     (Full remapping UI comes later; this is the default binding: top face button.) */
  const controllerPreset = { menuButton: 3 };
  const FACE_LABELS = {
    xbox: ['A', 'B', 'X', 'Y'],
    switch: ['B', 'A', 'Y', 'X'],
    ps: ['✕', '○', '□', '△']
  };
  function controllerKind() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(pads).find(p => p && p.connected);
    if (!gp) return 'xbox';
    const id = (gp.id || '').toLowerCase();
    if (id.includes('nintendo') || id.includes('switch') || id.includes('pro controller') || id.includes('joy-con') || id.includes('joycon')) return 'switch';
    if (id.includes('playstation') || id.includes('dualsense') || id.includes('dualshock') || id.includes('sony')) return 'ps';
    return 'xbox';
  }
  function faceLabel(btn) {
    const labels = FACE_LABELS[controllerKind()];
    return labels[btn] || '?';
  }
  function paintMenuTab() { menuTabBtn.textContent = faceLabel(controllerPreset.menuButton); }
  menuTab.addEventListener('click', e => { e.stopPropagation(); setMenu(true); });
  paintMenuTab();

  /* Side menu */
  const sideMenu = document.getElementById('sideMenu');
  const overlay = document.getElementById('menuOverlay');
  const menuBtns = Array.from(document.querySelectorAll('.menuBtn'));
  let menuOpen = false, menuFocus = 0;
  function setMenu(open) {
    menuOpen = open;
    document.body.classList.toggle('menu-open', open);
    sideMenu.classList.toggle('open', open);
    overlay.classList.toggle('show', open);
    if (open) { menuFocus = 0; paintMenu(); if (profileMenuOpen) setProfileMenu(false); }
  }
  function paintMenu() {
    menuBtns.forEach((b, k) => b.classList.toggle('focused', k === menuFocus));
  }
  overlay.addEventListener('click', () => setMenu(false));
  menuBtns.forEach((b, i) => {
    b.addEventListener('click', () => { menuFocus = i; paintMenu(); });
    b.addEventListener('mouseenter', () => { menuFocus = i; paintMenu(); });
  });

  /* Shop + communication features require an account */
  document.getElementById('menuShop').addEventListener('click', () => { requireAccount('the Shop'); });
  document.getElementById('menuFriends').addEventListener('click', () => { requireAccount('Friends'); });
  document.getElementById('menuMessages').addEventListener('click', () => { requireAccount('Messages'); });
  document.getElementById('menuProfile').addEventListener('click', () => { openAccount(''); });

  addEventListener('keydown', e => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
      if (e.key === 'Escape') ae.blur();
      return;
    }
    if (accountOpen) {
      if (e.key === 'Escape') closeAccount();
      return;
    }
    if (e.key === 'y' || e.key === 'Y') {
      if (profileMenuOpen) setProfileMenu(false);
      setMenu(!menuOpen);
      return;
    }
    if (profileMenuOpen) {
      const n = profileItems.length;
      if (e.key === 'ArrowDown') { profileFocus = Math.min(n - 1, profileFocus + 1); paintProfiles(); }
      else if (e.key === 'ArrowUp') { profileFocus = Math.max(0, profileFocus - 1); paintProfiles(); }
      else if (e.key === 'Enter' && profileItems[profileFocus]) profileItems[profileFocus].click();
      else if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') setProfileMenu(false);
      return;
    }
    if (menuOpen) {
      if (e.key === 'ArrowDown') { menuFocus = Math.min(menuBtns.length - 1, menuFocus + 1); paintMenu(); }
      else if (e.key === 'ArrowUp') { menuFocus = Math.max(0, menuFocus - 1); paintMenu(); }
      else if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') setMenu(false);
      return;
    }
    if (e.key === 'ArrowRight') setFocus(focus + 1);
    else if (e.key === 'ArrowLeft') setFocus(focus - 1);
  });
  tiles.forEach((t, i) => {
    t.addEventListener('click', () => setFocus(i));
    t.addEventListener('mouseenter', () => setFocus(i, false));
  });

  /* Gamepad: left joystick + d-pad move across tiles */
  const padState = { dir: 0, nextMove: 0 };
  function showPadStatus(on) {
    let el = document.getElementById('padStatus');
    if (on && !el) {
      el = document.createElement('div');
      el.id = 'padStatus';
      el.textContent = '🎮 CONTROLLER CONNECTED';
      document.getElementById('topIcons').appendChild(el);
    } else if (!on && el) el.remove();
  }
  addEventListener('gamepadconnected', () => { showPadStatus(true); paintMenuTab(); });
  addEventListener('gamepaddisconnected', () => { showPadStatus(false); paintMenuTab(); });
  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(pads).find(p => p && p.connected);
    const now = performance.now();
    const pressed = i => gp && gp.buttons[i] && gp.buttons[i].pressed;
    const axX = gp ? (gp.axes[0] || 0) : 0;
    const axY = gp ? (gp.axes[1] || 0) : 0;

    // Menu button (from the controller preset) toggles menu, B closes it, A selects in profile menu
    const yB = pressed(controllerPreset.menuButton), bB = pressed(1), aB = pressed(0);
    const yEdge = yB && !padState.yHeld, bEdge = bB && !padState.bHeld, aEdge = aB && !padState.aHeld;
    padState.yHeld = yB; padState.bHeld = bB; padState.aHeld = aB;

    if (profileMenuOpen) {
      let vdir = 0;
      if (axY > 0.5 || pressed(13)) vdir = 1;
      else if (axY < -0.5 || pressed(12)) vdir = -1;
      if (vdir !== 0) {
        if (padState.pdir !== vdir || now >= padState.pnext) {
          profileFocus = Math.max(0, Math.min(profileItems.length - 1, profileFocus + vdir));
          paintProfiles();
          padState.pnext = now + (padState.pdir === vdir ? 170 : 300);
          padState.pdir = vdir;
        }
      } else { padState.pdir = 0; padState.pnext = 0; }
      if (aEdge && profileItems[profileFocus]) profileItems[profileFocus].click();
      if (bEdge) setProfileMenu(false);
      if (yEdge) { setProfileMenu(false); setMenu(true); }
    } else {
      if (yEdge) setMenu(!menuOpen);
      if (bEdge && menuOpen) setMenu(false);
    }

    if (menuOpen) {
      let vdir = 0;
      if (axY > 0.5 || pressed(13)) vdir = 1;
      else if (axY < -0.5 || pressed(12)) vdir = -1;
      if (vdir !== 0) {
        if (padState.vdir !== vdir || now >= padState.vnext) {
          menuFocus = Math.max(0, Math.min(menuBtns.length - 1, menuFocus + vdir));
          paintMenu();
          padState.vnext = now + (padState.vdir === vdir ? 170 : 300);
          padState.vdir = vdir;
        }
      } else { padState.vdir = 0; padState.vnext = 0; }
    } else {
      let dir = 0;
      if (axX > 0.5 || pressed(15)) dir = 1;
      else if (axX < -0.5 || pressed(14)) dir = -1;
      if (dir !== 0) {
        if (padState.dir !== dir || now >= padState.nextMove) {
          setFocus(focus + dir);
          padState.nextMove = now + (padState.dir === dir ? 170 : 300);
          padState.dir = dir;
        }
      } else { padState.dir = 0; padState.nextMove = 0; }
    }
    requestAnimationFrame(pollPad);
  }
  requestAnimationFrame(pollPad);
  row.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); row.scrollLeft += e.deltaY; }
  }, { passive: false });

  /* Clock */
  function clock() {
    const d = new Date();
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    document.getElementById('clock').textContent = `${h}:${m} ${ap}`;
  }
  clock(); setInterval(clock, 15000);

  /* Boot -> home */
  let skipped = false;
  function goHome() {
    if (skipped) return; skipped = true;
    document.getElementById('boot').classList.add('done');
    document.getElementById('home').classList.add('show');
    document.getElementById('skipTip').style.display = 'none';
    setTimeout(() => setFocus(0), 1200);
    setTimeout(async () => {
      try {
        const { data: { session } } = await supa.auth.getSession();
        if (!session) openAccount('Welcome to Olympus — create your account to get started.');
      } catch (e) {}
    }, 1600);
  }
  setTimeout(goHome, 3400);
  addEventListener('click', e => { if (!skipped) goHome(); });
</script>
</body>
</html>
